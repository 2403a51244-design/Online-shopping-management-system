
<!DOCTYPE html>
<html>
<head>
    <title>Online Shopping</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f2f2f2;
        }

        h1 {
            background-color: navy;
            color: white;
            padding: 20px;
        }

        .product {
            display: inline-block;
            background: white;
            padding: 15px;
            margin: 15px;
            border-radius: 10px;
            width: 200px;
        }

        img {
            width: 150px;
            height: 150px;
        }

        button {
            background-color: green;
            color: white;
            padding: 10px;
            border: none;
        }
    </style>
</head>

<body>

    <h1>Online Shopping Store</h1>

    <h2>Our Products</h2>

    <div class="product">
        <img src="https://placehold.co/150x150?text=Mobile">
        <h3>Mobile Phone</h3>
        <p>Price: ₹15,000</p>
        <button>Add to Cart</button>
    </div>

    <div class="product">
        <img src="https://placehold.co/150x150?text=Laptop">
        <h3>Laptop</h3>
        <p>Price: ₹45,000</p>
        <button>Add to Cart</button>
    </div>

    <div class="product">
        <img src="https://placehold.co/150x150?text=Headphones">
        <h3>Headphones</h3>
        <p>Price: ₹2,000</p>
        <button>Add to Cart</button>
    </div>

</body>
</html>
